
name: Student Result ML CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ml-docker-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML Model
        run: python train_model.py

      - name: Check ML Quality Gate
        run: python quality_gate.py

      - name: Run Automated Tests
        run: pytest -v

      - name: Verify Docker Files
        run: |
          test -f Dockerfile
          test -f .dockerignore
          test -f app.py
          test -f requirements.txt
          test -f student_result_model.pkl
          test -f metrics.json
          echo "All Docker files verified successfully"

      - name: Build Docker Image
        run: |
          docker build -t student-result-ml:latest .

      - name: Test Docker Image
        run: |
          docker images

      - name: Prepare Release Candidate
        run: |
          mkdir -p release_candidate
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          cp app.py release_candidate/
          cp requirements.txt release_candidate/
          cp student_result_model.pkl release_candidate/
          cp metrics.json release_candidate/
          echo "Student Result ML Docker Release" > release_candidate/DEPLOYMENT.txt

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate/
